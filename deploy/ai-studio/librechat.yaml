version: 1.3.18

interface:
  customWelcome: "Wybierz THOX Open Qwen3 8B do rozmów z narzędziami MCP. Spark Heretic 4B jest szybszym, ręcznym fallbackiem do zwykłego czatu. MCP Ubuntu podaje tylko informacje o kontenerze i nie wykonuje poleceń."
  defaultPinnedTools:
    - mcp
  mcpServers:
    use: true
    create: true
    share: false
    public: false

mcpSettings:
  allowedAddresses:
    - ubuntu-system-info:8000

mcpServers:
  ubuntu-system-info:
    type: streamable-http
    url: http://ubuntu-system-info:8000/mcp
    startup: true
    title: Ubuntu System Info
    description: Read-only information about the Ubuntu 24.04 MCP container.

endpoints:
  custom:
    - name: Ollama
      apiKey: ollama
      baseURL: http://ollama:11434/v1/
      models:
        default:
          - thox-ai/thoxopen-8b-heretic:q4_k_m
          - maternion/spark-x2.5-heretic:4b
        fetch: false
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: Ollama
